services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jornadas
      POSTGRES_PASSWORD: jornadas
      POSTGRES_DB: jornadas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jornadas -d jornadas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jornadas:jornadas@db:5432/jornadas
      CORS_ORIGIN: http://localhost:8080,http://localhost:4200
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
